<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toyota Malaysia AI — Admin Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f4f7f5;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
.login-box{
    width:min(420px,92vw);
    background:#fff;
    border:1px solid #e3ebe6;
    border-radius:20px;
    padding:32px;
    box-shadow:0 15px 45px #123d2818;
}
.logo{
    width:54px;
    height:54px;
    border-radius:15px;
    background:#edf8f2;
    display:grid;
    place-items:center;
    font-size:25px;
    margin-bottom:18px;
}
h1{font-size:23px;font-weight:800;color:#0b3323}
.sub{font-size:13px;color:#718078}
.form-control{
    border-color:#dbe5df;
    border-radius:10px;
    padding:11px 12px;
}
.btn-green{
    background:#176b45;
    color:#fff;
    border:0;
    border-radius:10px;
    padding:11px;
    font-weight:700;
}
.btn-green:hover{background:#125a39;color:#fff}
.alert{font-size:13px}
</style>
</head>
<body>
<div class="login-box">
    <div class="logo">🚗</div>
    <h1>Toyota Malaysia AI</h1>
    <div class="sub mb-4">Dialer Administrator Login</div>

    {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}

    <form method="POST" autocomplete="off">
        <div class="mb-3">
            <label class="form-label small fw-bold">HNC Admin</label>
            <input
                type="text"
                name="username"
                class="form-control"
                autocomplete="username"
                required
                autofocus
            >
        </div>

        <div class="mb-4">
            <label class="form-label small fw-bold">HNC Password</label>
            <input
                type="password"
                name="password"
                class="form-control"
                autocomplete="current-password"
                required
            >
        </div>

        <button class="btn btn-green w-100" type="submit">
            Login
        </button>
    </form>

    <div class="small text-muted text-center mt-4">
        Access restricted to active Dialer admin user Level 9 administrators.
    </div>
</div>
</body>
</html>
